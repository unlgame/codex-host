version: 1
intent: >
  Windows-first distribution fork of BytePioneer-AI/codex-host. The fork keeps
  the upstream feature set but adds: a custom GitHub Actions Windows release
  pipeline, a pinned Desktop auto-updater disable (launcher injects
  CODEX_SPARKLE_ENABLED=false), a fork version number that must stay above the
  upstream tag so the built-in updater never "downgrades" users, and a small
  set of behavioural patches kept from earlier fork work (claude-code launcher
  and verbatim-quoting fixes, external-thread refresh against the stored
  record, renderer plugin route identity assertions).
  The Desktop "organization settings" gate bypass was removed in v0.15.1:
  measured logs on Desktop 26.1023 show the launcher's --inspect argument never
  reaches the AppX-activated Desktop, the real app-server is spawned, and
  configRequirements/read succeeds, so the gate no longer blocks.
  A sync must never drop the updater pin, the release pipeline, or the
  behavioural patches; everything else should track upstream releases.
own:
  patterns:
    - pattern: '.github/workflows/windows-release.yml'
      rationale: 'fork-only release pipeline; upstream has no equivalent file'
    - pattern: 'crates/launcher/src/main.rs'
      rationale: 'contains fork-only CODEX_SPARKLE_ENABLED=false injection in the Desktop environment; upstream launcher changes must be adapted around it'
    - pattern: 'packages/adapters/claude-code/src/command.ts'
      rationale: 'fork patch: resolve patched Windows launchers without claude.exe'
    - pattern: 'packages/adapters/claude-code/src/sdk-transport.ts'
      rationale: 'fork patch: forward verbatim quoting to the model inspector'
    - pattern: 'packages/host-runtime/src/external-thread-runtime.ts'
      rationale: 'fork patch: refresh reads the stored record instead of the in-memory copy, and surfaces the real error message instead of a generic -32081'
    - pattern: 'Cargo.toml'
      rationale: 'fork version must stay above the latest upstream tag'
    - pattern: 'package.json'
      rationale: 'fork version must stay above the latest upstream tag'
follow:
  patterns:
    - pattern: '**'
      rationale: 'everything else tracks upstream releases'
invariants:
  - id: keep-updater-pin
    description: 'The launcher must keep injecting CODEX_SPARKLE_ENABLED=false into the Desktop environment; dropping it lets Desktop auto-update past the pinned build.'
  - id: keep-windows-release
    description: 'The fork-only .github/workflows/windows-release.yml pipeline must survive syncs unchanged.'
  - id: keep-behavioural-patches
    description: 'The claude-code adapter patches, the external-thread refresh fix, and the renderer plugin route identity assertions must survive syncs.'
  - id: no-gate-bypass
    description: 'Do not reintroduce a Desktop inspector/gate-bypass: it never reached AppX-activated Desktop and the real app-server passes configRequirements/read on 26.1023.'
  - id: version-above-upstream
    description: 'After absorbing an upstream release, the fork version must be bumped above that upstream tag (e.g. upstream v0.15.0 -> fork v0.15.1).'
  - id: tests-must-pass
    description: 'Full vitest suite and launcher cargo tests must pass after the sync.'
rationale:
  - pattern: 'packages/adapters/claude-code/test/**'
    rationale: 'fork tests cover the adapter patches; upstream test edits need adaptation, not verbatim application'
  - pattern: 'packages/host-runtime/test/external-thread-runtime.test.ts'
    rationale: 'fork appends a refresh regression block; keep it when upstream rewrites the file'
  - pattern: 'packages/renderer-extension/test/renderer-binding-probe.test.ts'
    rationale: 'fork carries plugin route identity assertions that upstream refactored around; adapt rather than revert'
upstream_conflict_policy: prefer_fork
